<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection — BEYOND DESTINATIONS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="list">
  <header id="site-header"></header>

  <main class="container">
    <h1 class="page-title" data-i18n="list.title"></h1>
    <p class="page-lead" data-i18n="list.lead"></p>

    <div class="filters">
      <button class="filter-btn" data-kind="all" data-i18n="filter.all"></button>
      <button class="filter-btn" data-kind="session" data-i18n="filter.session"></button>
      <button class="filter-btn" data-kind="day" data-i18n="filter.day"></button>
    </div>

    <div class="exp-grid" id="exp-grid"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
