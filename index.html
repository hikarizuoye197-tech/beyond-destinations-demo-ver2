<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEYOND DESTINATIONS — Gifu experiences for travel agencies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <header id="site-header"></header>

  <main>
    <!-- ヒーロー -->
    <section class="hero">
      <div class="hero-frame">
        <img id="hero-art" src="img/washi-1.jpg" alt="">
        <div class="hero-inner">
          <p class="hero-kicker" data-i18n="hero.kicker"></p>
          <h1 class="hero-title" data-i18n-html="hero.title"></h1>
          <p class="hero-lead" data-i18n="hero.lead"></p>
          <div class="hero-ctas">
            <a class="btn btn-primary" href="experiences.html" data-i18n="hero.cta.collection"></a>
            <a class="btn btn-ghost" href="vision.html" data-i18n="hero.cta.how"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- 数字 -->
    <section class="facts container">
      <div class="fact"><p class="fact-v" data-i18n="facts.group.v"></p><p data-i18n="facts.group"></p></div>
      <div class="fact"><p class="fact-v" data-i18n="facts.hours.v"></p><p data-i18n="facts.hours"></p></div>
      <div class="fact"><p class="fact-v" id="fact-local">79%</p><p data-i18n="facts.local"></p></div>
      <div class="fact fact-text"><p data-i18n="facts.licensed"></p></div>
    </section>

    <!-- 選ばれる理由 -->
    <section class="concept container">
      <p class="kicker" data-i18n="why.kicker"></p>
      <h2 class="section-title" data-i18n="why.title"></h2>
      <div class="features">
        <div class="feature">
          <span class="feature-num">01</span>
          <h3 data-i18n="why.1.title"></h3>
          <p data-i18n="why.1.body"></p>
        </div>
        <div class="feature">
          <span class="feature-num">02</span>
          <h3 data-i18n="why.2.title"></h3>
          <p data-i18n="why.2.body"></p>
        </div>
        <div class="feature">
          <span class="feature-num">03</span>
          <h3 data-i18n="why.3.title"></h3>
          <p data-i18n="why.3.body"></p>
        </div>
      </div>
    </section>

    <!-- 体験 -->
    <section class="pickup container">
      <div class="pickup-head">
        <p class="kicker" data-i18n="pickup.kicker"></p>
        <h2 class="section-title" data-i18n="pickup.title"></h2>
      </div>
      <div class="exp-grid" id="pickup-grid"></div>
      <p class="pickup-more">
        <a class="btn btn-ghost" href="experiences.html" data-i18n="pickup.more"></a>
      </p>
    </section>

    <!-- 予約の流れ -->
    <section class="how container">
      <div class="pickup-head">
        <p class="kicker" data-i18n="how.kicker"></p>
        <h2 class="section-title" data-i18n="how.title"></h2>
      </div>
      <ol class="how-steps">
        <li><span>1</span><h3 data-i18n="how.1.title"></h3><p data-i18n="how.1.body"></p></li>
        <li><span>2</span><h3 data-i18n="how.2.title"></h3><p data-i18n="how.2.body"></p></li>
        <li><span>3</span><h3 data-i18n="how.3.title"></h3><p data-i18n="how.3.body"></p></li>
        <li><span>4</span><h3 data-i18n="how.4.title"></h3><p data-i18n="how.4.body"></p></li>
      </ol>
    </section>

    <!-- 岐阜 1.1% -->
    <section class="vision-strip">
      <img src="img/mino-street.jpg" alt="">
      <div class="vision-strip-inner">
        <h2 data-i18n="strip.title"></h2>
        <p class="strip-body" data-i18n="strip.body"></p>
        <a class="btn" href="vision.html" data-i18n="strip.cta"></a>
        <p class="strip-source" data-i18n="strip.source"></p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
