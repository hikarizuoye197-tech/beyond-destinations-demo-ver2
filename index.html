<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEYOND DESTINATIONS — 旅が、土地の未来になる。</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <header id="site-header"></header>

  <main>
    <!-- ヒーロー -->
    <section class="hero">
      <div class="hero-frame">
        <img id="hero-art" src="" alt="">
        <div class="hero-inner">
          <p class="hero-kicker" data-i18n="hero.kicker"></p>
          <h1 class="hero-title" data-i18n="hero.title"></h1>
          <p class="hero-lead" data-i18n="hero.lead"></p>
          <div class="hero-ctas">
            <a class="btn btn-primary" href="experiences.html" data-i18n="hero.cta.explore"></a>
            <a class="btn btn-ghost" href="vision.html" data-i18n="hero.cta.vision"></a>
          </div>
        </div>
      </div>
    </section>

    <!-- コンセプト -->
    <section class="concept container">
      <p class="kicker" data-i18n="index.concept.kicker"></p>
      <h2 class="section-title" data-i18n="index.concept.title"></h2>
      <p class="concept-body" data-i18n="index.concept.body"></p>

      <div class="features">
        <div class="feature">
          <span class="feature-num">01</span>
          <h3 data-i18n="index.feature1.title"></h3>
          <p data-i18n="index.feature1.body"></p>
        </div>
        <div class="feature">
          <span class="feature-num">02</span>
          <h3 data-i18n="index.feature2.title"></h3>
          <p data-i18n="index.feature2.body"></p>
        </div>
        <div class="feature">
          <span class="feature-num">03</span>
          <h3 data-i18n="index.feature3.title"></h3>
          <p data-i18n="index.feature3.body"></p>
        </div>
      </div>
    </section>

    <!-- おすすめ体験 -->
    <section class="pickup container">
      <div class="pickup-head">
        <p class="kicker" data-i18n="index.pickup.kicker"></p>
        <h2 class="section-title" data-i18n="index.pickup.title"></h2>
      </div>
      <div class="exp-grid" id="pickup-grid"></div>
      <p class="pickup-more">
        <a class="btn btn-ghost" href="experiences.html" data-i18n="index.pickup.more"></a>
      </p>
    </section>

    <!-- ビジョン導線 -->
    <section class="vision-strip">
      <img id="vision-strip-art" src="" alt="">
      <div class="vision-strip-inner">
        <h2 data-i18n="index.visionstrip.title"></h2>
        <a class="btn" href="vision.html" data-i18n="index.visionstrip.cta"></a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
