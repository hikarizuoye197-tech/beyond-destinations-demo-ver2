<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How we work — BEYOND DESTINATIONS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="vision">
  <header id="site-header"></header>

  <main>
    <section class="vision-hero">
      <img id="vision-art-1" src="" alt="">
      <div class="vision-hero-inner">
        <p class="kicker" data-i18n="how.page.kicker"></p>
        <h1 class="vision-hero-title" data-i18n-html="how.page.title"></h1>
        <p class="vision-statement" data-i18n="how.page.lead"></p>
      </div>
    </section>

    <!-- 役割の図 -->
    <section class="vision-section">
      <div class="center-head">
        <p class="kicker" data-i18n="how.role.kicker"></p>
        <h2 class="section-title" data-i18n="how.role.title"></h2>
      </div>
      <div class="role-map">
        <div class="role"><h3 data-i18n="how.role.makers"></h3><p data-i18n="how.role.makers.sub"></p></div>
        <div class="role-arrow" aria-hidden="true">⇄</div>
        <div class="role role-bd"><h3>BEYOND<br>DESTINATIONS</h3><p data-i18n="how.role.bd.sub"></p></div>
        <div class="role-arrow" aria-hidden="true">⇄</div>
        <div class="role"><h3 data-i18n="how.role.you"></h3><p data-i18n="how.role.you.sub"></p></div>
      </div>
      <p class="role-partner" data-i18n="how.role.partner"></p>
    </section>


    <!-- これから -->
    <section class="vision-section">
      <div class="center-head">
        <p class="kicker" data-i18n="how.road.kicker"></p>
        <h2 class="section-title" data-i18n="how.road.title"></h2>
      </div>
      <ol class="how-steps road">
        <li><span>1</span><h3 data-i18n="how.road.1.title"></h3><p data-i18n="how.road.1.body"></p></li>
        <li><span>2</span><h3 data-i18n="how.road.2.title"></h3><p data-i18n="how.road.2.body"></p></li>
        <li><span>3</span><h3 data-i18n="how.road.3.title"></h3><p data-i18n="how.road.3.body"></p></li>
      </ol>
    </section>

    <!-- 連絡先 -->
    <section class="vision-section">
      <div class="origin">
        <p class="kicker" data-i18n="how.team.kicker"></p>
        <p class="team-name" data-i18n="how.team.name"></p>
        <p class="origin-body" data-i18n="how.team.body"></p>
      </div>
    </section>

    <div class="vision-cta">
      <a class="btn btn-primary" href="experiences.html" data-i18n="how.cta"></a>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
