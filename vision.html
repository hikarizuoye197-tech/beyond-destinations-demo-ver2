<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビジョン — BEYOND DESTINATIONS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="vision">
  <header id="site-header"></header>

  <main>
    <!-- ビジョンステートメント -->
    <section class="vision-hero">
      <img id="vision-art-1" src="" alt="">
      <div class="vision-hero-inner">
        <p class="kicker" data-i18n="vision.kicker"></p>
        <h1 class="vision-hero-title" data-i18n-html="vision.title"></h1>
        <p class="vision-statement" data-i18n="vision.statement"></p>
      </div>
    </section>

    <!-- 課題認識 -->
    <section class="vision-section">
      <div class="vision-section-inner">
        <div class="vision-text">
          <p class="kicker" data-i18n="vision.problem.kicker"></p>
          <h2 class="section-title" data-i18n="vision.problem.title"></h2>
          <p data-i18n="vision.problem.body"></p>
        </div>
        <div class="vision-img"><img id="vision-art-2" src="" alt=""></div>
      </div>
    </section>

    <!-- 本来の日本 -->
    <section class="vision-section">
      <div class="vision-section-inner reverse">
        <div class="vision-text">
          <p class="kicker" data-i18n="vision.honrai.kicker"></p>
          <h2 class="section-title" data-i18n="vision.honrai.title"></h2>
          <p data-i18n="vision.honrai.body"></p>
        </div>
        <div class="vision-img"><img id="vision-art-3" src="" alt=""></div>
      </div>
    </section>

    <!-- 仕組みとの接続 -->
    <section class="vision-section">
      <div class="vision-text" style="max-width: 620px; margin: 0 auto; text-align: center;">
        <p class="kicker" data-i18n="vision.score.kicker"></p>
        <h2 class="section-title" data-i18n="vision.score.title"></h2>
        <p data-i18n="vision.score.body"></p>
      </div>
    </section>

    <div class="vision-cta">
      <a class="btn btn-primary" href="experiences.html" data-i18n="vision.cta"></a>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
